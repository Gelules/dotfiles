# /etc/X11/xorg.conf.d/30-touchpad.conf (repo: system/etc/X11/xorg.conf.d/)
# Same behaviour as this user's GNOME settings (tap-to-click, natural
# scrolling, two-finger click = right click). Options: man 4 libinput.
# Takes effect at the next X start (log out / GDM restart).
Section "InputClass"
    Identifier "touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "on"
    Option "NaturalScrolling" "true"
    Option "ClickMethod" "clickfinger"
EndSection

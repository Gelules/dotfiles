# /etc/X11/xorg.conf.d/30-touchpad.conf (repo: system/etc/X11/xorg.conf.d/)
# Tap-to-click and two-finger click = right click. Scrolling keeps libinput's
# classic direction (no NaturalScrolling). Options: man 4 libinput.
# Takes effect at the next X start (log out / GDM restart).
Section "InputClass"
    Identifier "touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "on"
    Option "ClickMethod" "clickfinger"
EndSection

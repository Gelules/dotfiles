# picom 13 -- "Stencil" rice. Target: ~/.config/picom/picom.conf
# Every key checked against `man picom` (v13) and src/config_libconfig.c @ v13.
# Only non-default values are set.

# Meteor Lake / Mesa iris (glamor GL 4.6 in Xorg.0.log). dual_kawase blur
# needs glx: the xrender backend disables it. Fallback if artifacts: "xrender".
backend = "glx";
vsync = true;

# Soft shadow, centred horizontally, slightly below the window.
# Invisible on the black wallpaper; shows over other windows and popups.
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.55;
shadow-offset-x = -18;
shadow-offset-y = -12;

# ~125 ms fades (default steps 0.028/0.03 at fade-delta 10 ms are ~350 ms,
# and awesome maps/unmaps every client on each tag switch).
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;

# Same radius as the wibar (dpi(6) = 8 px at Xft.dpi 120).
corner-radius = 8;

blur: {
  method = "dual_kawase";
  strength = 4;
};

# Rules replace shadow-exclude/wintypes/etc. (ignored once rules exist).
# Later rules win.
rules = (
  # A blur method turns blur on for every translucent window: allow-list it.
  { blur-background = false; },
  { match = "class_g = 'Alacritty'"; blur-background = true; },

  # awesome's wibar: awesome rounds it itself (see theme.lua); keep window
  # shadows from painting over it.
  { match = "window_type = 'dock' || window_type = 'desktop'";
    shadow = false; corner-radius = 0; clip-shadow-above = true; },

  # GTK client-side decorated windows draw their own shadow and corners.
  { match = "_GTK_FRAME_EXTENTS@"; shadow = false; corner-radius = 0; },

  # With rules, fullscreen windows are no longer un-rounded by default.
  { match = "fullscreen"; shadow = false; corner-radius = 0; }
);

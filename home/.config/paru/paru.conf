# paru reads this file INSTEAD of /etc/paru.conf, not on top of it: the [options] below
# start with the ones that were active there.
[options]
PgpFetch
Devel
Provides
DevelSuffixes = -git -cvs -svn -bzr -darcs -always -hg -fossil
# Unread Arch news before each upgrade (was 'paru -Pw' in up(), ~/.zshrc)
NewsOnUpgrade

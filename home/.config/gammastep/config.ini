; Night light: widgets/nightlight.lua starts and stops gammastep. Options: man gammastep
[general]
; 6500 K is neutral: no change in daytime
temp-day=6500
temp-night=3700
; No fade in or out: the wibar toggle acts at once, and a quick off/on can't find the old
; instance still fading out. Sunset itself stays gradual (twilight).
fade=0
; X11 (else it tries Wayland first and logs an error at each start)
adjustment-method=randr
location-provider=manual

; Sunrise and sunset are computed from this. Paris, rounded: this repo is public
[manual]
lat=48.9
lon=2.3

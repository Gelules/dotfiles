# Same file for ~/.config/gtk-3.0/settings.ini and ~/.config/gtk-4.0/settings.ini.
# Under awesome no XSETTINGS daemon runs, so GTK reads these files.
# adw-gtk3-dark ships gtk-3.0 and gtk-4.0 dirs (package adw-gtk-theme):
# GTK3 apps and plain-GTK4 apps (pavucontrol) look like libadwaita ones.
# prefer-dark keeps things dark even if the theme package is missing;
# libadwaita apps only log a warning about it and follow
# `gsettings ... color-scheme 'prefer-dark'` instead.
[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-application-prefer-dark-theme=true
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=Adwaita Sans 11
gtk-cursor-theme-size=30
